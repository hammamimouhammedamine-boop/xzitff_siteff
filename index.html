<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Page</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0f172a;
overflow:hidden;
}

.container{

width:350px;
padding:40px;
background:rgba(255,255,255,0.05);

border:1px solid rgba(255,255,255,0.1);

backdrop-filter:blur(10px);

border-radius:20px;

box-shadow:0 0 30px rgba(0,0,0,0.5);

text-align:center;

}

h1{
color:white;
margin-bottom:30px;
font-size:40px;
}

.input-box{
margin-bottom:20px;
}

input{

width:100%;
padding:15px;

border:none;
outline:none;

border-radius:12px;

background:#1e293b;

color:white;

font-size:16px;

}

input::placeholder{
color:#94a3b8;
}

button{

width:100%;
padding:15px;

border:none;

border-radius:12px;

background:#38bdf8;

color:white;

font-size:18px;

cursor:pointer;

transition:0.3s;

}

button:hover{

background:#0ea5e9;
transform:scale(1.03);

}

.text{

margin-top:20px;
color:#94a3b8;

}

</style>

</head>

<body>

<div class="container">

<h1>LOGIN</h1>

<div class="input-box">
<input type="text" placeholder="Username">
</div>

<div class="input-box">
<input type="password" placeholder="Password">
</div>

<button onclick="login()">
Login
</button>

<p class="text">
Welcome To xzitff 🔥
</p>

</div>

<script>

function login(){

alert("Login Successful 🔥")

}

</script>

</body>
</html>
